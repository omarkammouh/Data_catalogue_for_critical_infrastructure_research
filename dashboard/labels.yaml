# Written display labels for vocabulary values (audit E10, 2026-09-26).
#
# The dashboard used to show vocabulary keys with underscores replaced and the first letter
# capitalised ("Gas hydrogen", "Vulnerability fragility", "Dams flood defences", "Gis environment").
# These are the labels a reader sees instead. Keys are the vocabulary values of schema/vocab.yaml
# (sectors as group.sector, sector groups and data-family groups by their own key). A value missing here
# falls back to the humanised key; build.py lists every such value, and the dashboard tests require none
# for the real vocabulary. Labels are sentence case, with "and" or a comma where the key joins two ideas.
