name: Correct metadata
description: Correct an existing catalogue record.
body:
  - type: textarea
    id: subject
    attributes:
      label: Resource or problem
      description: Include the record ID or resource name, where applicable.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and steps
      description: Provide primary-source links, infrastructure relevance, or steps to reproduce the problem. Do not include private information.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: Describe the correction or expected result.
