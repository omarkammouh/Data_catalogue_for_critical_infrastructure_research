maturity:
  record_field: maturity
  target: maturity
  multi: false
  label: Maturity
  # Proposed change: "active" and "maintained" had no written difference and were used interchangeably,
  # so they are one value; "unknown" becomes "not_stated" like every other filter.
  values:
    active: [Active, "Still developed or maintained: updated in the last two years or declared maintained. A dated paper, report or data deposit with no upkeep is active while its last release or update is less than two years old."]
    stale: [Inactive (no update for 2+ years), "Still available but not updated for more than two years. A dated paper, report or data deposit with no upkeep counts here once its last release or update is more than two years old."]
    archived: [Archived or withdrawn, "Withdrawn, frozen, discontinued or superseded."]
    not_stated: [Not stated, "The maturity could not be determined from the source, and the record gives no last update date to decide it from."]
