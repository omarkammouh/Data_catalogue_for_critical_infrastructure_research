    json: [JSON, "JSON files, including JSON-stat and JSON Lines, but not GeoJSON."]
    xml: [XML, "XML files and schemas (XSD), other than GML and domain XML listed elsewhere."]
    plain_text: [Plain text, "TXT and fixed-width ASCII files whose structure is not stated."]
    geojson: [GeoJSON, GeoJSON and TopoJSON vector files.]
    shapefile: [Shapefile, Esri shapefile.]
    geopackage: [GeoPackage, OGC GeoPackage.]
    kml: [KML or KMZ, Google Earth KML and KMZ.]
    gml: [GML or CityGML, "OGC GML, CityGML and INSPIRE GML."]
    esri_geodatabase: [Esri geodatabase, "File geodatabase, personal geodatabase, layer and map packages."]
    other_vector: [Other map vector formats, "Other vector GIS files: MapInfo TAB and MIF, GPX, OSM PBF and OSM XML, FlatGeobuf, vector tiles."]
    raster: [Raster grid, "Georeferenced raster files: GeoTIFF, Cloud Optimized GeoTIFF, ASCII grid, ERDAS IMG, JPEG 2000, DEM files."]
    netcdf_hdf: ["NetCDF, HDF or GRIB", "Multidimensional scientific arrays: NetCDF, HDF4, HDF5, GRIB, Zarr."]
    parquet: [Parquet or Arrow, "Columnar files: Parquet, GeoParquet, Arrow, Feather."]
    database: [Database or linked data, "Database files, dumps and linked-data stores: SQLite, SQL dumps, PostgreSQL or PostGIS, Access MDB, RDF and Turtle."]
    analysis_package_file: [Statistics software file, "Files in an analysis package's own format: Stata, SPSS, SAS, R data, MATLAB MAT, PC-Axis PX, SDMX."]
    domain_model_file: [Simulation tool file, "Input or output files of a specific simulation tool or instrument: EnergyPlus IDF and EPW, EPANET INP, MATPOWER, PSS/E RAW, OpenDSS, RINEX, PCAP, GraphML."]
    cad_bim_3d: ["CAD, BIM or 3D model", "CAD, BIM and 3D files: IFC, DWG, DXF, Revit, OBJ, glTF, 3D Tiles, CityJSON, LAS and LAZ point clouds."]
    transit_feed: [Public transport feed, "Public transport feeds: GTFS, GTFS Realtime, NeTEx, SIRI."]
    api: [Web API, "Data served through a programming interface rather than a file: REST, JSON or GraphQL APIs, Socrata, CKAN, SPARQL, OData, MQTT."]
    ogc_map_service: [Online map service, "Map and feature services: OGC WMS, WFS, WMTS, WCS, OGC API, ArcGIS REST map and feature services."]
    web_page: [Web page or viewer, "Content seen in a browser rather than downloaded: HTML pages and tables, web maps, dashboards, online databases."]
    document: [Document, "Reports and documentation: PDF, Word, Markdown, README, slides."]
    image: ["Image, audio or video", "Pictures, charts, audio and video that are not georeferenced rasters: PNG, JPEG, SVG, maps as pictures, MP4, WAV."]
    source_code: [Source code, "Scripts, packages and notebooks: Python, R, Julia, MATLAB code, Jupyter notebooks."]
    software_package: [Software package, "Installable programs: executables, installers, containers, virtual machine images."]
    archive: [Compressed archive, "ZIP, RAR, 7z or TAR archives whose contents are not stated."]
    other: [Other, A stated format that fits none of the values above.]
    not_stated: [Not stated, The format is not stated or could not be read.]

update_frequency:
  record_field: update_frequency
  target: update_frequency
  multi: false
  label: Update frequency
  values:
    real_time: [Continuous (real time), "Continuously or within minutes: live feeds, streams, near real time."]
    sub_daily: [Several times a day, "Hourly or several times a day, but not continuously."]
    daily: [Daily, Once a day or on working days.]
    weekly: [Weekly, Once a week or a few times a month.]
    monthly: [Monthly, Once a month.]
    several_per_year: [Several times a year, "Quarterly, half-yearly or a few times a year."]
    annual: [Annual, Once a year.]
    multi_year: [Every few years, "Every two to ten years, such as census cycles."]
    irregular: [Irregular, "Updated, but without a fixed schedule: versioned releases, as needed, periodic."]
    not_updated: [Never updated (one-off), "A one-off release, a static or historical dataset, or discontinued."]
    other: [Other, A stated frequency that fits none of the values above.]
    varies: [Varies, Different parts are updated at different rates.]
    not_stated: [Not stated, The update frequency is not stated or could not be read.]

temporal_resolution:
  record_field: temporal_resolution
  target: temporal_resolution_class
  multi: false
  label: Time step
  values:
    sub_hourly: [Under one hour, "Seconds to minutes: 1 s, 1 min, 15 min."]
    hourly: [Hourly, "One hour up to less than a day, such as 3- or 6-hourly."]
    daily: [Daily, One value per day.]
    weekly: [Weekly, One value per week.]
    monthly: [Monthly, One value per month.]
    sub_annual: [Quarterly or seasonal, "Quarterly, seasonal or half-yearly."]
    annual: [Annual, "One value per year, including financial years."]
    multi_year: [Every few years, "Every two or more years, such as census rounds."]
    event: [One record per event, "One record per event, incident, test or trip, not on a fixed step."]
    snapshot: [Single point in time, "One point in time or no time dimension: static, cross-sectional, a single census."]
    other: [Other, A stated time step that fits none of the values above.]
    varies: [Varies, Different parts use different time steps.]
    not_stated: [Not stated, The time step is not stated or could not be read.]

