    10m_to_100m: [10 to 100 m, "Grid cells from 10 up to 100 metres."]
    100m_to_1km: [100 m to 1 km, "Grid cells from 100 metres up to 1 kilometre (about 30 arc-seconds)."]
    1km_to_10km: [1 to 10 km, "Grid cells from 1 up to 10 kilometres (about 5 arc-minutes)."]
    over_10km: [Over 10 km, "Grid cells of 10 kilometres or more (0.1 degree and coarser)."]
    asset: [Individual assets or sites, "One feature per asset, site or event: buildings, facilities, stations, road segments, coordinates."]
    local_units: [Municipalities and districts, "Small areas below the region: municipalities, counties, districts, census tracts, postcodes, zones."]
    regional_units: [States and provinces, "States, provinces or regions within a country."]
    national: [Whole country, "One value per country, operator or border."]
    other: [Other, A stated resolution that fits none of the values above.]
    varies: [Varies, Several resolutions in one resource.]
    non_spatial: [Not spatial, The resource has no spatial dimension.]
    not_stated: [Not stated, The spatial resolution is not stated or could not be read.]

