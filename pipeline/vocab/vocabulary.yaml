# Controlled vocabularies for the dashboard filters (proposed 2026-09-29, waiting for the user's confirmation).
#
# Why: the free-text record fields behind several filters had grown to thousands of spellings of the same
# few ideas ("not stated", "Not stated.", "not established", "unknown", "not stated on the page read" ...).
# Each filter below gets a short list of values that do not overlap and are not synonyms of each other.
# Every raw value found in the records is mapped to these values in <field>.csv next to this file.
#
# One word per meaning, the same in every filter:
#   not_stated  the value was looked for and the source does not give it, or the source could not be read.
#               It absorbs "unknown", "unclear", "not established", "not specified", "not read", "none stated",
#               blank strings and every "not stated on the page ..." variant. No filter has a separate
#               "unknown" value.
#   varies      the source gives different values for different parts of the resource (per dataset, per
#               layer, per item) and no single value for the whole.
#   other       the source gives a value that is clear but fits no listed value. When a value lands in
#               "other" often, it is a signal to add a value here, not to force a fit.
#   A field that does not apply to a resource is simply absent; it gets no "not applicable" value, except
#   where "does not apply" is itself a useful fact (spatial resolution: non_spatial; time step: snapshot).
#
# Layout: field -> {record_field, target, facet, label, values: {value: [label, definition]}}.
#   record_field  the field in the record files that holds the raw text
#   target        the field the normalised value goes to: the same field when the raw text is only a variant
#                 of a category, or a new field when the raw text keeps detail the category loses
#   multi         true when a record can carry several values (a record with code under MIT and data under
#                 CC BY carries both "permissive_code" and "attribution")

licence:
  record_field: licence
  target: licence_type
  multi: true
  label: Licence type
  values:
    public_domain: [Public domain, "No rights reserved: CC0, PDDL, the Unlicense, government works placed in the public domain (such as U.S. federal works)."]
    attribution: ["Open, credit required", "Free reuse including commercial use, only credit required: CC BY, ODC-By, open government licences (OGL, Licence Ouverte, Datenlizenz Deutschland, NLOD) and provider licences with the same terms."]
    share_alike: ["Open, share alike", "Free reuse including commercial use, but derived data must carry the same licence: CC BY-SA, ODbL."]
    non_commercial: [Non-commercial only, "Reuse allowed for non-commercial, research or education use only: CC BY-NC (any variant, including NC-ND and NC-SA) and provider terms that say academic or research use only."]
    no_derivatives: [No modified versions, "Redistribution allowed, including commercially, but no modified versions: CC BY-ND."]
    permissive_code: ["Open-source code, free reuse", "Open-source software licence without copyleft: MIT, BSD, Apache, ISC, zlib, Boost, Python."]
    copyleft_code: ["Open-source code, derivatives stay open", "Open-source software licence whose derived works must stay open: GPL, LGPL, AGPL, MPL, EPL, EUPL, CeCILL."]
    provider_terms: [Provider's own terms of use, "The provider's own terms of use or data policy, not a standard licence, allowing use under stated conditions (for example citation, no redistribution)."]
    proprietary: [Proprietary, "All rights reserved, a commercial or subscription licence, freeware under an end-user licence, or use only with the owner's permission."]
    other: [Other, "A licence statement that is clear but fits none of the values above."]
    varies: [Varies by item, "Each dataset, layer or item has its own licence and none is stated for the whole resource."]
    not_stated: [Not stated, "No licence or terms found on the pages read, or the pages could not be read. A bare site copyright notice counts here, as the licence and links pass decided on 2026-09-28."]
    conflicting: [Conflicting source statements, "Reviewed sources disagree on a resource's licence, or specify different terms whose compatibility has not been established. The record preserves each statement; applicable reuse terms remain unresolved."]

licence_name:
  record_field: licence
  target: licence_name
  multi: true
  label: Standard licence
  # Only recognised standard licences get a value; versions are folded (CC BY 3.0 and CC BY 4.0 are both "CC BY"),
  # because the version is kept in the record text and a filter by version splits one licence into near-synonyms.
  values:
    CC0: [CC0, Creative Commons Zero public-domain dedication.]
    PDDL: [ODC PDDL, Open Data Commons Public Domain Dedication and Licence.]
    Unlicense: [Unlicense, The Unlicense public-domain dedication for software.]
    US-Gov-PD: [U.S. government work, "A work of the U.S. federal government, public domain in the United States."]
    CC-BY: [CC BY, "Creative Commons Attribution, any version."]
    CC-BY-SA: [CC BY-SA, "Creative Commons Attribution-ShareAlike, any version."]
    CC-BY-NC: [CC BY-NC, "Creative Commons Attribution-NonCommercial, any version."]
    CC-BY-NC-SA: [CC BY-NC-SA, "Creative Commons Attribution-NonCommercial-ShareAlike, any version."]
    CC-BY-ND: [CC BY-ND, "Creative Commons Attribution-NoDerivatives, any version."]
    CC-BY-NC-ND: [CC BY-NC-ND, "Creative Commons Attribution-NonCommercial-NoDerivatives, any version."]
    ODC-By: [ODC-By, Open Data Commons Attribution Licence.]
    ODbL: [ODbL, Open Data Commons Open Database Licence.]
    OGL-UK: [UK Open Government Licence, "UK Open Government Licence, any version."]
    OGL-Canada: [Open Government Licence Canada, "Open Government Licence Canada, including provincial versions."]
    Etalab: [Licence Ouverte (Etalab), "French Licence Ouverte / Open Licence, versions 1 and 2."]
    DL-DE: [Datenlizenz Deutschland, "German Data Licence, attribution or zero variant."]
    NLOD: [NLOD, Norwegian Licence for Open Government Data.]
    MIT: [MIT, MIT licence and MIT-0.]
    BSD: [BSD, "BSD licences, 0-, 2- and 3-clause."]
    Apache: [Apache, "Apache License, any version."]
    ISC: [ISC, ISC licence.]
    GPL: [GPL, "GNU General Public License, any version, only or or-later."]
    LGPL: [LGPL, "GNU Lesser General Public License, any version."]
    AGPL: [AGPL, "GNU Affero General Public License, any version."]
    MPL: [MPL, "Mozilla Public License, any version."]
    EPL: [EPL, "Eclipse Public License, any version."]
    EUPL: [EUPL, "European Union Public Licence, any version."]
    CeCILL: [CeCILL, "CeCILL licences, any variant."]
    AFL: [AFL, Academic Free License.]
    BSL: [Boost, Boost Software License.]
    Zlib: [zlib, zlib licence.]
    CDLA: [CDLA, Community Data License Agreement (permissive or sharing).]

